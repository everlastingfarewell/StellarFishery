[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stellarfishery"
version = "0.3.0"
description = "Vulkan ocean: fixed-step height field, spectral cascades, water optics and foam"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "wgpu==0.33.0",
    "rendercanvas==3.0.1",
    "numpy>=2.1,<3",
    "Pillow>=11,<14",
]

[project.optional-dependencies]
# The interactive window uses GLFW; the tests and the Brick do not.
gui = ["glfw==2.11.0"]

[tool.setuptools]
packages = ["stellar"]

[tool.setuptools.package-data]
stellar = ["caustics.png"]

[tool.ruff]
line-length = 120
target-version = "py313"
